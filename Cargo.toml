# Aggregator staticlib: links `ant-ffi` (Swarm) + `freedom-ipfs-mobile`
# (IPFS) into ONE Rust staticlib. Two separately-built Rust staticlibs
# in one iOS app collide on the Rust runtime / allocator / panic
# machinery; compiling both into a single staticlib gives the app one
# copy of std + one libp2p/tokio, with both C ABIs exported. See the
# `ant-ffi` README "Combining with other Rust libraries in the same app".
#
# Local-dev: path deps to sibling checkouts. Published builds pin the
# two libraries to git tags instead.
[package]
name = "freedom-mobile-ffi"
version = "0.1.0"
edition = "2021"
publish = false

# Empty workspace table so cargo treats this as a standalone package and
# does NOT try to absorb it into (or walk up to) either node repo's
# workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]
name = "freedom_mobile_ffi"

[features]
# `chain`: the on-chain `/wallet` `/stamps` `/chequebook` gateway
# surfaces (light-mode parity with desktop antd). Pulls ant-chain →
# reqwest/rustls into the slice. Default-on so the iOS xcframework
# keeps its surface; the Android build passes --no-default-features
# because freedom-browser-android exposes no wallet UI and its previous
# standalone libant_ffi.so was built without it.
default = ["chain", "radicle"]
chain = ["ant-ffi/chain"]
# `radicle`: the embedded Radicle node (libradicle-uniffi, Swift-facing
# UniFFI surface). Default-on for the iOS xcframework; the Android build's
# --no-default-features drops it (no Kotlin bindings, no consumer there yet).
radicle = ["dep:libradicle-uniffi"]
# `tor`: an embedded Arti (Tor) client behind a loopback SOCKS5 listener
# that only connects to `.onion` hosts (`freedom_tor_*`, include/freedom_tor.h;
# src/tor.rs). Opt-in on both platforms: freedom-browser-android turns it on
# with its enable-ffi-tor.sh helper; the iOS xcframework leaves it off.
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:tokio"]

[dependencies]
# UNRELEASED: both pinned by rev to the branches that export their tracing
# layers (ant `log_layer`, freedom-ipfs `progress_layer`) for
# `freedom_mobile_init_logging`. Swap for their release tags once those
# branches are merged and tagged.
ant-ffi = { git = "ssh://git@github.com/freedom-hq/ant.git", tag = "v0.5.58" }
freedom-ipfs-mobile = { git = "ssh://git@github.com/solardev-xyz/freedom-ipfs.git", tag = "v0.4.4" }
# The one process-wide subscriber carrying both nodes' layers
# (`freedom_mobile_init_logging`). Same 0.3 the nodes already link.
# `tracing` installs it and `tracing-log` bridges `log` records into it —
# called directly rather than via `try_init`, which would report a
# host-installed `log` logger as a failure after the subscriber is already in.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
# SPIKE (Phase 0): Myotis — fully-P2P verified Ethereum light client
# (myotis_* C ABI, JSON-over-C-strings like ant_*). v0.1.12 = engine ABI 32 (#465 fixes: peer-head admission/ranking,
# finalized-anchored windows, snapServingPeers, host seed pins; v0.1.11 hedged reads). Public repo, https is fine.
myotis-engine = { git = "https://github.com/biafra23/myotis.git", tag = "v0.1.12" }
# Fourth member: Radicle (UniFFI `uniffi_libradicle_uniffi_*` scaffolding
# symbols, JSON-string returns mirroring the desktop napi addon). `no-spawn`
# is what lets the phone publish: the embedded node serves fetches in-process
# (no `git upload-pack`) and skips `git gc`. Swift glue is generated by
# `bindgen/` at xcframework-build time from the compiled staticlib.
libradicle-uniffi = { git = "ssh://git@github.com/solardev-xyz/libradicle.git", tag = "v0.8.0", features = ["no-spawn"], optional = true }
# Arti, pinned exactly: src/tor.rs reports ARTI_VERSION as the Tor client's
# version, so bump both together. rustls (not native-tls: no OpenSSL on
# Android) and the onion-service client, nothing else.
arti-client = { version = "=0.46.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite"], optional = true }
tor-rtcompat = { version = "=0.46.0", default-features = false, features = ["tokio", "rustls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"], optional = true }

# Local-dev override: point at sibling checkouts to test un-tagged work
# before cutting tags (uncomment these, comment the git deps above).
# Keep both in sync with the build script's header resolution — it reads
# `ant.h` / `freedom_ipfs.h` from whichever source cargo resolved.
# ant-ffi = { path = "../ant/crates/ant-ffi" }
# freedom-ipfs-mobile = { path = "../freedom-ipfs/crates/freedom-ipfs-mobile" }

[dev-dependencies]
# tests/radicle_smoke.rs parses the JSON-string returns.
serde_json = "1"
# tests/logging_log_preinstalled.rs installs a host `log` logger first.
log = "0.4"

# Radicle (heartwood → `sqlite` → sqlite3-sys → sqlite3-src) and ant
# (rusqlite → libsqlite3-sys) both claim `links = "sqlite3"`, which cargo
# rejects in one graph. The no-op stand-in drops the claim and the C build;
# radicle's sqlite bindings resolve against the single bundled SQLite that
# libsqlite3-sys already contributes. See vendor/sqlite3-src/README.md.
[patch.crates-io]
sqlite3-src = { path = "vendor/sqlite3-src" }

[profile.release]
# Match the per-library iOS release profiles; keep panic=unwind (Rust
# staticlib default on Apple) consistent across the merged graph.
opt-level = 3

# Android cdylib profile (scripts/build-android.sh). Deliberately NOT
# [profile.release]: unwinding buys nothing across a C ABI, and the
# size levers matter more on Android where the .so ships inside the
# APK. Mirrors ant's own release profile (see ant/Cargo.toml).
[profile.release-android]
inherits = "release"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
