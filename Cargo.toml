# Aggregator staticlib: links `ant-ffi` (Swarm) + `freedom-ipfs-mobile`
# (IPFS) into ONE Rust staticlib. Two separately-built Rust staticlibs
# in one iOS app collide on the Rust runtime / allocator / panic
# machinery; compiling both into a single staticlib gives the app one
# copy of std + one libp2p/tokio, with both C ABIs exported. See the
# `ant-ffi` README "Combining with other Rust libraries in the same app".
#
# Local-dev: path deps to sibling checkouts. Published builds pin the
# two libraries to git tags instead.
[package]
name = "freedom-mobile-ffi"
version = "0.1.0"
edition = "2021"
publish = false

# Empty workspace table so cargo treats this as a standalone package and
# does NOT try to absorb it into (or walk up to) either node repo's
# workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]
name = "freedom_mobile_ffi"

[features]
# `chain`: the on-chain `/wallet` `/stamps` `/chequebook` gateway
# surfaces (light-mode parity with desktop antd). Pulls ant-chain →
# reqwest/rustls into the slice. Default-on so the iOS xcframework
# keeps its surface; the Android build passes --no-default-features
# because freedom-browser-android exposes no wallet UI and its previous
# standalone libant_ffi.so was built without it.
default = ["chain"]
chain = ["ant-ffi/chain"]

[dependencies]
ant-ffi = { git = "ssh://git@github.com/solardev-xyz/ant.git", tag = "v0.5.43" }
freedom-ipfs-mobile = { git = "ssh://git@github.com/solardev-xyz/freedom-ipfs.git", tag = "v0.4.3" }
# SPIKE (Phase 0): Myotis — fully-P2P verified Ethereum light client
# (myotis_* C ABI, JSON-over-C-strings like ant_*). v0.1.7 = engine ABI 22,
# the revision freedom-browser PR #181 validates. Public repo, https is fine.
myotis-engine = { git = "https://github.com/biafra23/myotis.git", tag = "v0.1.7" }

# Local-dev override: point at sibling checkouts to test un-tagged work
# before cutting tags (uncomment these, comment the git deps above).
# Keep both in sync with the build script's header resolution — it reads
# `ant.h` / `freedom_ipfs.h` from whichever source cargo resolved.
# ant-ffi = { path = "../ant/crates/ant-ffi" }
# freedom-ipfs-mobile = { path = "../freedom-ipfs/crates/freedom-ipfs-mobile" }

[profile.release]
# Match the per-library iOS release profiles; keep panic=unwind (Rust
# staticlib default on Apple) consistent across the merged graph.
opt-level = 3

# Android cdylib profile (scripts/build-android.sh). Deliberately NOT
# [profile.release]: unwinding buys nothing across a C ABI, and the
# size levers matter more on Android where the .so ships inside the
# APK. Mirrors ant's own release profile (see ant/Cargo.toml).
[profile.release-android]
inherits = "release"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
